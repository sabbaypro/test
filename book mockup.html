<!-- 1. Include Library (HTML to Image) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<!-- 2. Scoped CSS for Blogger -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    #bmg-app {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --success: #10b981;
        --success-hover: #059669;
        --surface: #ffffff;
        --background: transparent;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --radius: 12px;
        font-family: 'Inter', sans-serif;
        color: var(--text-main);
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        box-sizing: border-box;
    }

    #bmg-app * { box-sizing: border-box; }

    #bmg-app .header { text-align: center; margin-bottom: 25px; }
    #bmg-app .header h2 { margin: 0; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    #bmg-app .card {
        background: var(--surface);
        padding: 20px;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        border: 1px solid var(--border);
        margin-bottom: 24px;
    }

    #bmg-app .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    #bmg-app .form-group { display: flex; flex-direction: column; gap: 8px; }
    #bmg-app .form-group label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    #bmg-app .input-group { display: flex; gap: 8px; }
    
    #bmg-app input[type="text"], #bmg-app input[type="url"] {
        flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
    }
    #bmg-app input[type="text"]:focus, #bmg-app input[type="url"]:focus { border-color: var(--primary); }

    #bmg-app .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px;
        border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: 0.2s;
    }
    #bmg-app .btn svg { width: 16px; height: 16px; }
    #bmg-app .btn-primary { background: var(--primary); color: white; }
    #bmg-app .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
    #bmg-app .btn-success { background: var(--success); color: white; }
    
    #bmg-app .file-upload-wrapper { position: relative; display: inline-block; }
    #bmg-app .file-upload-wrapper input[type="file"] { position: absolute; right: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }

    #bmg-app .color-row { display: flex; gap: 15px; background: #f8fafc; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
    #bmg-app .color-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    #bmg-app input[type="color"] { border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; background: none; padding: 0; }

    #bmg-app .download-section { display: none; justify-content: center; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); flex-wrap: wrap; }

    #bmg-app .preview-container {
        display: flex; justify-content: center; overflow-x: auto; padding: 20px 0; background: #e2e8f0; border-radius: var(--radius);
    }

    /* Ratio 5:7 with Padding (Top:5, Bot:10, L:20, R:20) */
    #bmg-app #captureArea {
        width: 500px; min-width: 500px;
        height: 700px; min-height: 700px;
        padding: 5px 20px 10px 20px; 
        background: linear-gradient(135deg, #528088, #304a50);
        display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
    }

    #bmg-app .scale-container { transform: scale(0.65); display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
    #bmg-app .scene { perspective: 2500px; width: 500px; height: 700px; position: relative; }
    #bmg-app .book-3d { width: 500px; height: 700px; position: relative; transform-style: preserve-3d; transform: rotateX(4deg) rotateY(32deg) rotateZ(-1deg); }
    #bmg-app .face { position: absolute; }

    #bmg-app .front {
        width: 500px; height: 700px; top: 0; left: 0; transform: translateZ(25px); background: #fff;
        border-radius: 2px 6px 6px 2px; box-shadow: inset 3px 0 8px rgba(0,0,0,0.08); overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    #bmg-app .cover-img { width: 100%; height: 100%; object-fit: cover; }
    #bmg-app .placeholder-content { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #94a3b8; }
    
    #bmg-app .spine {
        width: 50px; height: 700px; background: #fff; transform: rotateY(-90deg) translateZ(25px); left: 0; top: 0;
        border-radius: 3px 0 0 3px; box-shadow: inset -3px 0 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #bmg-app .spine-text { writing-mode: vertical-rl; text-orientation: mixed; font-size: 18px; font-weight: 700; color: #1f2937; letter-spacing: 2px; text-transform: uppercase; }
    
    #bmg-app .top-edge {
        width: 500px; height: 50px; background: #fdfdfd; transform: rotateX(90deg) translateZ(25px); top: -2px; left: 0;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.05); background-image: repeating-linear-gradient(to right, #fdfdfd, #fdfdfd 2px, #ececec 3px);
    }
    #bmg-app .book-shadow {
        position: absolute; width: 550px; height: 720px; background: rgba(0, 0, 0, 0.45);
        transform: rotateY(32deg) translateZ(-40px) translateX(-60px) translateY(20px); filter: blur(35px); border-radius: 10px; top: 0; left: 0; pointer-events: none;
    }
</style>

<!-- 3. App HTML Wrapper -->
<div id="bmg-app">
    <div class="header">
        <h2>
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Book Mockup Generator
        </h2>
    </div>

    <div class="card">
        <div class="controls-grid">
            <div class="form-group">
                <label>រូបភាពគម្រប (Cover URL / Upload)</label>
                <div class="input-group">
                    <input type="url" id="imageUrl" placeholder="Image URL...">
                    <button class="btn btn-primary" onclick="loadImageFromUrl()">Load</button>
                    <div class="file-upload-wrapper">
                        <button class="btn btn-outline">Upload</button>
                        <input type="file" id="imageUpload" accept="image/*" onchange="previewUploadedImage(event)">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>អក្សរចំហៀងសៀវភៅ (Spine Text)</label>
                <input type="text" id="spineTextInput" value="BOOK COVER MOCKUP" oninput="updateSpineText()">
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>ពណ៌ផ្ទៃខាងក្រោយ (Background)</label>
            <div class="color-row">
                <div class="color-item">Grad 1: <input type="color" id="bgColor1" value="#528088" oninput="updateBackground()"></div>
                <div class="color-item">Grad 2: <input type="color" id="bgColor2" value="#304a50" oninput="updateBackground()"></div>
            </div>
        </div>

        <div id="downloadGroup" class="download-section">
            <span style="font-weight: 600;">Download 5:7 (HD):</span>
            <button class="btn btn-success" onclick="downloadMockup('png')">PNG</button>
            <button class="btn btn-success" onclick="downloadMockup('jpeg')">JPEG</button>
            <button class="btn btn-success" onclick="downloadMockup('webm')">WEBP</button>
        </div>
    </div>

    <div class="preview-container">
        <div id="captureArea">
            <div class="scale-container">
                <div class="scene">
                    <div class="book-shadow"></div>
                    <div class="book-3d">
                        <div class="face front" id="bookFront">
                            <div class="placeholder-content" id="placeholderText">
                                <span>សូមបញ្ចូលរូបភាព</span>
                            </div>
                        </div>
                        <div class="face spine">
                            <span class="spine-text" id="spineTextDisplay">BOOK COVER MOCKUP</span>
                        </div>
                        <div class="face top-edge"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 4. App JavaScript -->
<script>
    function updateSpineText() {
        document.getElementById('spineTextDisplay').innerText = document.getElementById('spineTextInput').value || '';
    }

    function updateBackground() {
        const c1 = document.getElementById('bgColor1').value;
        const c2 = document.getElementById('bgColor2').value;
        document.getElementById('captureArea').style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
    }

    function loadImageFromUrl() {
        const url = document.getElementById('imageUrl').value.trim();
        if (url) setBookCover(url);
    }

    function previewUploadedImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => setBookCover(e.target.result);
            reader.readAsDataURL(file);
        }
    }

    function setBookCover(imgSrc) {
        const bookFront = document.getElementById('bookFront');
        const placeholder = document.getElementById('placeholderText');
        if (placeholder) placeholder.style.display = 'none';
        
        const oldImg = bookFront.querySelector('.cover-img');
        if (oldImg) oldImg.remove();

        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'cover-img';
        img.crossOrigin = 'anonymous';
        bookFront.appendChild(img);
        
        document.getElementById('downloadGroup').style.display = 'flex';
    }

    function downloadMockup(format) {
        const area = document.getElementById('captureArea');
        const opt = { quality: 0.95, pixelRatio: 2 }; // Output HD រក្សាខ្នាត 5:7
        
        let p, ext = format;
        if (format === 'jpeg') p = htmlToImage.toJpeg(area, opt);
        else if (format === 'webm') { ext = 'webp'; p = htmlToImage.toBlob(area, opt).then(b => URL.createObjectURL(b)); }
        else p = htmlToImage.toPng(area, opt);

        p.then(url => {
            const a = document.createElement('a');
            a.download = `Mockup-5x7-${Date.now()}.${ext}`;
            a.href = url;
            a.click();
        }).catch(err => alert('Error downloading! ' + err));
    }
</script>
